name: CI

on:
  pull_request:
    branches: [main]
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Run tests
        run: go test -race -count=1 ./...
      - name: Run vet
        run: go vet ./...
      - name: Build all packages
        run: go build ./...
